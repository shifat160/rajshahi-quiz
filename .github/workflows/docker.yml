name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rajshahi-quiz:latest

      # Tell xCloud to pull the freshly-pushed image and redeploy.
      # Runs only after the image is published, so xCloud never pulls a stale image.
      - name: Trigger xCloud deploy
        env:
          HOOK: ${{ secrets.XCLOUD_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Triggering xCloud deploy..."
            curl -fsS -X POST "$HOOK" && echo "" && echo "xCloud deploy triggered."
          else
            echo "No XCLOUD_DEPLOY_HOOK secret set; skipping deploy trigger."
          fi
